name: ORP frontend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate OpenAPI schemas and examples
        run: pnpm check:openapi
      - name: Typecheck ORP console
        run: pnpm --filter @vben/web-antd run typecheck
      - name: Build ORP console
        run: pnpm --filter @vben/web-antd run build
