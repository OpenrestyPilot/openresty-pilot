<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORP · 实时请求大屏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #10295e 0%, #060d23 55%, #03060f 100%);
      color: #cfe3ff;
    }
    .screen { display: flex; flex-direction: column; width: 100%; height: 100%; padding: 12px 16px; gap: 10px; }

    /* 顶部标题栏 */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      height: 56px; padding: 0 18px;
      background: linear-gradient(90deg, rgba(20, 60, 135, 0.55), rgba(10, 30, 75, 0.2) 40%, rgba(20, 60, 135, 0.55));
      border: 1px solid rgba(64, 148, 255, 0.35); border-radius: 8px;
      position: relative;
    }
    .header::before, .header::after {
      content: ""; position: absolute; top: 50%; width: 120px; height: 2px;
      background: linear-gradient(90deg, transparent, #37c6ff);
    }
    .header::before { left: -110px; }
    .header::after { right: -110px; transform: scaleX(-1); }
    .header h1 {
      font-size: 24px; letter-spacing: 4px; color: #fff;
      text-shadow: 0 0 14px rgba(55, 198, 255, 0.85); font-weight: 600;
    }
    .header .sub { font-size: 12px; color: #7ea6d8; letter-spacing: 2px; }
    .header .clock { font-size: 18px; color: #ffd76e; font-family: Consolas, monospace; letter-spacing: 1px; }

    /* 主体三栏 */
    .main { flex: 1; display: flex; gap: 10px; min-height: 0; }
    .side { width: 300px; display: flex; flex-direction: column; gap: 10px; }
    .center-map { flex: 1; min-width: 0; position: relative; border: 1px solid rgba(64, 148, 255, 0.3); border-radius: 8px; background: rgba(8, 22, 55, 0.35); overflow: hidden; }
    .center-map .map-title {
      position: absolute; top: 10px; left: 14px; z-index: 5;
      font-size: 14px; color: #9fd0ff; letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(55, 198, 255, 0.6);
    }
    #map { position: absolute; inset: 0; }

    /* 面板 */
    .panel {
      background: rgba(8, 22, 55, 0.55);
      border: 1px solid rgba(64, 148, 255, 0.3); border-radius: 8px;
      padding: 10px 14px; flex: 1; min-height: 0; display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }
    .panel::before {
      content: ""; position: absolute; top: 0; left: 0; width: 26px; height: 3px; background: #37c6ff;
      box-shadow: 0 0 10px #37c6ff;
    }
    .panel h3 {
      font-size: 13px; color: #9fd0ff; letter-spacing: 2px; margin-bottom: 8px; font-weight: 500;
      display: flex; align-items: center; gap: 6px;
    }
    .panel h3::before { content: "◈"; color: #37c6ff; }

    /* 指标卡 */
    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .kpi { background: rgba(16, 42, 100, 0.5); border: 1px solid rgba(64, 148, 255, 0.25); border-radius: 6px; padding: 8px 10px; }
    .kpi .label { font-size: 11px; color: #7ea6d8; margin-bottom: 4px; }
    .kpi .value { font-size: 20px; font-family: Consolas, monospace; color: #fff; font-weight: 600; }
    .kpi .value.cyan { color: #37c6ff; text-shadow: 0 0 10px rgba(55, 198, 255, 0.5); }
    .kpi .value.green { color: #5ef2b0; text-shadow: 0 0 10px rgba(94, 242, 176, 0.5); }
    .kpi .value.red { color: #ff7a8a; text-shadow: 0 0 10px rgba(255, 122, 138, 0.5); }
    .kpi .value.gold { color: #ffd76e; text-shadow: 0 0 10px rgba(255, 215, 110, 0.5); }

    /* Top 榜 */
    .rank { flex: 1; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
    .rank-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .rank-item .no { width: 18px; height: 18px; border-radius: 3px; background: rgba(55, 198, 255, 0.15); color: #37c6ff; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
    .rank-item:nth-child(1) .no { background: #ff6b6b; color: #fff; }
    .rank-item:nth-child(2) .no { background: #ffb84d; color: #fff; }
    .rank-item:nth-child(3) .no { background: #5ef2b0; color: #06281a; }
    .rank-item .name { width: 92px; color: #cfe3ff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-item .bar-wrap { flex: 1; height: 8px; background: rgba(20, 50, 110, 0.6); border-radius: 4px; overflow: hidden; }
    .rank-item .bar { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #1668dc, #37c6ff); box-shadow: 0 0 8px rgba(55, 198, 255, 0.6); transition: width 0.8s ease; }
    .rank-item .num { width: 64px; text-align: right; font-family: Consolas, monospace; color: #9fd0ff; }

    /* 状态码图 */
    #statusChart { flex: 1; min-height: 0; }

    /* 节点表 */
    .nodes { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 5px; }
    .node-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; padding: 3px 6px; border-radius: 4px; background: rgba(16, 42, 100, 0.35); }
    .node-row .n { color: #cfe3ff; }
    .node-row .v { font-family: Consolas, monospace; color: #37c6ff; }

    .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #7ea6d8; font-size: 14px; letter-spacing: 2px; z-index: 20; background: rgba(3, 6, 15, 0.8); }
    .geo-status { position: absolute; right: 12px; bottom: 10px; z-index: 5; max-width: min(70%, 520px); padding: 6px 10px; border: 1px solid rgba(64, 148, 255, 0.35); border-radius: 6px; background: rgba(3, 10, 26, 0.78); color: #9fc7ee; font-size: 11px; line-height: 1.5; pointer-events: none; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="header">
      <div>
        <h1 id="title">ORP 实时请求大屏</h1>
        <div class="sub" id="subtitle">REALTIME REQUEST MONITORING · 全球流量态势</div>
      </div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
    <div class="main">
      <div class="side">
        <div class="panel" style="flex:0 0 auto;">
          <h3>实时核心指标</h3>
          <div class="kpi-grid">
            <div class="kpi"><div class="label">近 1 小时平均 QPS</div><div class="value cyan" id="kpiQps">--</div></div>
            <div class="kpi"><div class="label">近 1 小时请求</div><div class="value" id="kpiTotal">--</div></div>
            <div class="kpi"><div class="label">请求错误率</div><div class="value red" id="kpiErr">--</div></div>
            <div class="kpi"><div class="label">活跃节点</div><div class="value green" id="kpiNodes">--</div></div>
          </div>
        </div>
        <div class="panel">
          <h3>访问域名 TOP8</h3>
          <div class="rank" id="rank"></div>
        </div>
      </div>
      <div class="center-map">
        <div class="map-title" id="mapTitle">--</div>
        <div id="map"></div>
        <div class="loading" id="loading">地图数据加载中…</div>
        <div class="geo-status" id="geoStatus" aria-live="polite">正在连接实时指标…</div>
      </div>
      <div class="side">
        <div class="panel">
          <h3>HTTP 状态码分布</h3>
          <div id="statusChart"></div>
        </div>
        <div class="panel">
          <h3>节点活跃连接</h3>
          <div class="nodes" id="nodes"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../maps/vendor/echarts.min.js"></script>
  <script src="../maps/vendor/echarts-gl.js"></script>
  <script>
  (function () {
    'use strict';
    // ===== URL 参数 =====
    var qs = new URLSearchParams(location.search);
    var MAP_KEY = qs.get('map') || 'world';          // world | sichuan | chengdu
    var MODE = qs.get('mode') || '2d';               // 2d | 3d
    var TITLES = {
      world: ['世界地图', 'WORLDWIDE'],
      sichuan: ['四川省地图', 'SICHUAN PROVINCE'],
      chengdu: ['成都市地图', 'CHENGDU CITY'],
    };
    var GEO_FILES = { world: '../maps/world.json', sichuan: '../maps/sichuan.json', chengdu: '../maps/chengdu.json' };

    document.getElementById('title').textContent = 'ORP 实时请求大屏 · ' + TITLES[MAP_KEY][0] + '（' + MODE.toUpperCase() + '）';
    document.getElementById('subtitle').textContent = 'REALTIME REQUEST MONITORING · ' + TITLES[MAP_KEY][0] + '流量态势';
    document.getElementById('mapTitle').textContent = TITLES[MAP_KEY][0] + ' · 实时请求态势';

    // 静态地图只提供边界轮廓；点和流线来自后端 GeoIP 聚合。
    var geography = { state: 'loading', points: [], centers: [], flows: [], unknownRequests: 0 };
    var sources = [];
    var nodeLoads = [];
    var statusCodes = [
      { name: '2xx 成功', value: 0, itemStyle: { color: '#5ef2b0' } },
      { name: '3xx 重定向', value: 0, itemStyle: { color: '#37c6ff' } },
      { name: '4xx 客户端错误', value: 0, itemStyle: { color: '#ffd76e' } },
      { name: '5xx 服务端错误', value: 0, itemStyle: { color: '#ff7a8a' } },
    ];
    var state = { qps: 0, total: 0, errRate: 0, activeNodes: 0 };

    function applyLiveData(metrics, rankings) {
      var summary = metrics.summary || {};
      var codes = metrics.statusCodes || {};
      geography = metrics.geography || { state: 'disabled', reason: '服务端未返回地理统计', points: [], centers: [], flows: [], unknownRequests: 0 };
      state.qps = Number(summary.qpsAvg || 0);
      state.total = Number(summary.totalRequests || 0);
      state.errRate = Number(summary.errorRate || 0).toFixed(2);
      nodeLoads = metrics.nodeLoad || [];
      state.activeNodes = nodeLoads.filter(function (n) { return n.status === 'running'; }).length;
      sources = (rankings.domains || []).slice(0, 8).map(function (item) {
        return { name: item.domain, value: item.requests };
      });
      statusCodes[0].value = Number(codes.c2xx || 0);
      statusCodes[1].value = Number(codes.c3xx || 0);
      statusCodes[2].value = Number(codes.c4xx || 0);
      statusCodes[3].value = Number(codes.c5xx || 0);
      renderPanels();
      updateCharts();
    }

    window.addEventListener('message', function (event) {
      if (event.origin !== window.location.origin || !event.data) return;
      if (event.data.type === 'orp-live-dashboard') {
        applyLiveData(event.data.metrics || {}, event.data.rankings || {});
        updateGeoStatus();
      } else if (event.data.type === 'orp-live-dashboard-error') {
        var statusEl = document.getElementById('geoStatus');
        if (statusEl) statusEl.textContent = '实时指标读取失败，正在重试';
      }
    });

    function fmt(n) {
      if (n >= 100000000) return (n / 100000000).toFixed(2) + '亿';
      if (n >= 10000) return (n / 10000).toFixed(1) + '万';
      return String(n);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }

    function renderPanels() {
      document.getElementById('kpiQps').textContent = state.qps.toFixed(3);
      document.getElementById('kpiTotal').textContent = fmt(state.total);
      document.getElementById('kpiErr').textContent = state.errRate + '%';
      document.getElementById('kpiNodes').textContent = state.activeNodes;
      // Top 榜
      var max = sources[0] ? sources[0].value : 1;
      document.getElementById('rank').innerHTML = sources.map(function (s, i) {
        var w = Math.max(6, Math.round(s.value / max * 100));
        return '<div class="rank-item"><span class="no">' + (i + 1) + '</span><span class="name" title="' + escapeHtml(s.name) + '">' + escapeHtml(s.name) +
          '</span><span class="bar-wrap"><span class="bar" style="width:' + w + '%"></span></span><span class="num">' + fmt(s.value) + '</span></div>';
      }).join('');
      // 节点排行
      var rows = nodeLoads.map(function (n) { return { name: n.name, v: n.conns || 0 }; })
        .sort(function (a, b) { return b.v - a.v; }).slice(0, 10);
      document.getElementById('nodes').innerHTML = rows.map(function (r) {
        return '<div class="node-row"><span class="n">' + escapeHtml(r.name) + '</span><span class="v">' + r.v.toLocaleString() + ' 连接</span></div>';
      }).join('');
    }

    // ===== 时钟 =====
    setInterval(function () {
      var d = new Date();
      var p = function (x) { return x < 10 ? '0' + x : x; };
      document.getElementById('clock').textContent = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }, 1000);

    // ===== 图表 =====
    var mapChart = echarts.init(document.getElementById('map'));
    window.__orpMapChart = mapChart;
    var statusChart = echarts.init(document.getElementById('statusChart'));

    function buildLinkData() {
      return (geography.flows || []).map(function (flow) {
        return { name: flow.source + ' → ' + flow.center, coords: flow.coords, value: Number(flow.requests || 0) };
      });
    }

    function buildScatterData() {
      return (geography.points || []).map(function (point) {
        return { name: point.name, value: point.coord.concat([Number(point.requests || 0)]) };
      });
    }

    function buildHubData() {
      return (geography.centers || []).map(function (center) {
        return { name: center.name, value: center.coord.concat([0]), itemStyle: { color: '#ffd76e', opacity: 1 } };
      });
    }

    function buildParticleData(t) {
      return buildLinkData().map(function (flow) {
        var progress = ((t / 1800) + (flow.value % 100) / 100) % 1;
        var a = flow.coords[0], b = flow.coords[1];
        return { name: flow.name, value: [a[0] + (b[0] - a[0]) * progress, a[1] + (b[1] - a[1]) * progress, 0, Math.min(1, flow.value / 1000)] };
      });
    }

    function updateGeoStatus() {
      var statusEl = document.getElementById('geoStatus');
      if (!statusEl) return;
      if (geography.state === 'ready') {
        statusEl.textContent = 'GeoIP 采样 ' + (geography.sampledEvents || 0) + ' 条 · 未定位 ' + (geography.unknownRequests || 0) + ' 条';
      } else if (geography.state === 'error') {
        statusEl.textContent = geography.reason || 'GeoIP 数据读取失败';
      } else if (geography.state === 'loading') {
        statusEl.textContent = '正在连接实时指标…';
      } else {
        statusEl.textContent = geography.reason || '未配置 GeoIP 数据库；地图显示实时指标，不绘制来源点';
      }
    }

    function option2d() {
      return {
        backgroundColor: 'transparent',
        tooltip: { trigger: 'item', backgroundColor: 'rgba(6,16,40,0.9)', borderColor: '#2a6bd8', textStyle: { color: '#cfe3ff', fontSize: 12 } },
        geo: { map: 'orp', silent: false, roam: true, zoom: 1.05, itemStyle: { areaColor: '#122a5e', borderColor: '#37c6ff', borderWidth: 0.8 }, emphasis: { itemStyle: { areaColor: '#1d4fa8' }, label: { color: '#cfe3ff', fontSize: 10 } }, label: { show: true, color: 'rgba(160,200,255,0.55)', fontSize: 9 } },
        series: (function () {
          var flow = [{
            type: 'lines', coordinateSystem: 'geo', zlevel: 2, silent: true,
            effect: { show: true, period: 4, trailLength: 0.25, symbol: 'arrow', symbolSize: 5, color: '#9ff4ff' },
            lineStyle: { color: '#37c6ff', width: 1, opacity: 0.55, curveness: 0.28 },
            data: buildLinkData(),
          }];
          return flow.concat([
            {
              type: 'effectScatter', coordinateSystem: 'geo', zlevel: 3,
              rippleEffect: { brushType: 'stroke', scale: 3.2, period: 4 },
              symbolSize: function () { return 12; },
              itemStyle: { shadowBlur: 12, shadowColor: '#ffd76e' },
              label: { show: true, position: 'right', formatter: '{b}', color: '#ffe4a0', fontSize: 10 },
              data: buildHubData(),
            },
            {
              type: 'scatter', coordinateSystem: 'geo', zlevel: 3,
              symbolSize: function (v) { return 5 + Math.min(9, (v[2] / 6000) * 9); },
              itemStyle: { color: '#2fd8ff', shadowBlur: 8, shadowColor: 'rgba(47,216,255,0.8)' },
              data: buildScatterData(),
            },
            {
              id: 'particles', type: 'scatter', coordinateSystem: 'geo', zlevel: 4, silent: true,
              symbolSize: function (v) { return 4 + v[3] * 6; },
              data: buildParticleData(0),
            },
          ]);
        })(),
      };
    }

    function option3d() {
      return {
        backgroundColor: 'transparent',
        tooltip: { show: true, backgroundColor: 'rgba(6,16,40,0.9)', borderColor: '#2a6bd8', textStyle: { color: '#cfe3ff', fontSize: 12 } },
        geo3D: {
          map: 'orp', regionHeight: 3, shading: 'realistic',
          // 微金属度 + 降粗糙：暗色科技风下保留地形起伏的高清质感
          realisticMaterial: { roughness: 0.82, metalness: 0.08 },
          viewControl: { alpha: 42, beta: 8, distance: 105, autoRotate: true, autoRotateSpeed: 4, autoRotateAfterStill: 3 },
          // 偏冷光 + 提环境光：深蓝渐变基调下保证高亮区色彩饱满可辨
          light: { main: { intensity: 1.2, shadow: true, alpha: 50, beta: 15 }, ambient: { intensity: 0.55 } },
          regions: buildSatRegions(),
          itemStyle: { color: '#081a3a', areaColor: '#081a3a', borderColor: 'rgba(72,152,255,0.32)', borderWidth: 0.6, opacity: 1 },
          emphasis: { itemStyle: { color: '#1d5ad0', areaColor: '#1d5ad0' }, label: { show: true, color: '#cfe3ff', fontSize: 10 } },
          label: { show: true, textStyle: { color: 'rgba(220,238,255,0.72)', fontSize: 9, borderWidth: 0 } },
          // 泛光增强：让高亮区域、地标与流线粒子产生科技感辉光
          postEffect: { enable: true, bloom: { enable: true, bloomIntensity: 0.22 }, SSAO: { enable: true, quality: 'medium', radius: 2, intensity: 1.2 } },
        },
        series: (function () {
          var flow = [{
            type: 'lines3D', coordinateSystem: 'geo3D', blendMode: 'lighter', silent: true,
            effect: { show: true, trailWidth: 3, trailLength: 0.3, trailOpacity: 0.9, trailColor: '#9ff4ff', period: 4 },
            lineStyle: { width: 1, color: '#37c6ff', opacity: 0.55 },
            data: buildLinkData(),
          }];
          return [
            {
              type: 'scatter3D', coordinateSystem: 'geo3D', blendMode: 'lighter',
              symbolSize: function (v) { return 5 + Math.min(8, (v[2] / 6000) * 8); },
              itemStyle: { color: '#2fd8ff', opacity: 0.9 },
              data: buildScatterData(),
            },
            {
              type: 'scatter3D', coordinateSystem: 'geo3D', blendMode: 'lighter',
              symbolSize: function () { return 10; },
              label: { show: true, formatter: '{b}', position: 'top', distance: 4, textStyle: { color: '#ffe4a0', fontSize: 10, borderWidth: 0 } },
              data: buildHubData(),
            },
          ].concat(flow, [{
            // 发光粒子云层：id 定位供 raf 循环局部刷新
            id: 'particles', type: 'scatter3D', coordinateSystem: 'geo3D', blendMode: 'lighter', silent: true,
            symbolSize: function (v) { return 3.5 + v[3] * 5.5; },
            itemStyle: { opacity: 0.8 },
            data: buildParticleData(0),
          }]);
        })(),
      };
    }

    function statusOption() {
      return {
        backgroundColor: 'transparent',
        tooltip: { trigger: 'item', backgroundColor: 'rgba(6,16,40,0.9)', borderColor: '#2a6bd8', textStyle: { color: '#cfe3ff', fontSize: 12 } },
        series: [{
          type: 'pie', radius: ['52%', '74%'], center: ['50%', '50%'],
          avoidLabelOverlap: true,
          itemStyle: { borderColor: '#081a3a', borderWidth: 2 },
          label: { color: '#9fd0ff', fontSize: 11, formatter: '{b}\n{d}%' },
          labelLine: { lineStyle: { color: 'rgba(64,148,255,0.5)' } },
          emphasis: { scale: true, scaleSize: 5 },
          data: statusCodes,
        }],
      };
    }

    var curOption = null;

    /* ===== 3D 地图底色使用稳定哈希着色，不暗示业务热点 ===== */
    var GEO_JSON = null;
    var SAT_TECH = ['#071738', '#0a1f47', '#0d2756', '#102f64', '#143772', '#183f80', '#1d478e', '#224f9c', '#2859aa', '#2e63b8'];
    function terrainIndex(name) {
      var h = 0, i;
      var s = String(name || '');
      for (i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
      return h % SAT_TECH.length;
    }
    function buildSatRegions() {
      if (!GEO_JSON || !GEO_JSON.features) return [];
      return GEO_JSON.features.map(function (ft) {
        var name = (ft.properties && (ft.properties.name || ft.properties.NAME)) || '';
        // 普通区域：深蓝渐变底 + 亮蓝路网轮廓微光
        var base = SAT_TECH[terrainIndex(name)];
        return { name: name, itemStyle: { color: base, areaColor: base, borderColor: 'rgba(72,152,255,0.38)', borderWidth: 0.7 } };
      });
    }

    function updateCharts() {
      if (!curOption) return;
      var o = MODE === '3d' ? option3d() : option2d();
      mapChart.setOption(o);
      statusChart.setOption(statusOption());
    }

    // ===== 粒子漂移动画：120ms 节流，按 series id 局部刷新（不重建整图）=====
    var lastDrift = 0;
    (function drift(ts) {
      requestAnimationFrame(drift);
      if (!curOption || ts - lastDrift < 120) return;
      lastDrift = ts;
      try {
        mapChart.setOption({ series: [{ id: 'particles', data: buildParticleData(ts) }] });
      } catch (e) { /* 粒子更新失败不影响主图 */ }
    })(0);

    window.addEventListener('resize', function () { mapChart.resize(); statusChart.resize(); });

    // ===== 启动 =====
    var loadingEl = document.getElementById('loading');
    fetch(GEO_FILES[MAP_KEY])
      .then(function (r) { return r.json(); })
      .then(function (geo) {
        echarts.registerMap('orp', geo);
        GEO_JSON = geo;
        curOption = MODE === '3d' ? option3d() : option2d();
        mapChart.setOption(curOption);
        if (loadingEl) loadingEl.style.display = 'none';
        updateGeoStatus();
      })
      .catch(function (e) {
        if (loadingEl) {
          loadingEl.textContent = '地图渲染失败：' + e;
        }
        console.error('[orp-screen]', e);
      });
  })();
  </script>
</body>
</html>
