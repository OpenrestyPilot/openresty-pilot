workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-beta\.\d+)?$/'
    - when: never

stages:
  - build
  - release

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: /certs/client

build-artifacts:
  stage: build
  image: docker:27.4.1-cli
  services:
    - name: docker:27.4.1-dind
      alias: docker
  before_script:
    - |
      for attempt in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        sleep 1
      done
      docker info
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - mkdir -p dist
    - docker build --pull --platform=linux/amd64 --target binary --build-arg BUILD_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" --build-arg BUILD_COMMIT="$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/build:$CI_COMMIT_SHA" .
    - build_container=$(docker create "$CI_REGISTRY_IMAGE/build:$CI_COMMIT_SHA")
    - docker cp "$build_container:/orp" dist/orp
    - docker rm "$build_container"
    - chmod 0755 dist/orp
    - docker build --pull --platform=linux/amd64 --build-arg BUILD_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" --build-arg BUILD_COMMIT="$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        case "$CI_COMMIT_TAG" in
          *-beta.*)
            docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:beta"
            docker push "$CI_REGISTRY_IMAGE:beta"
            ;;
          *)
            docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:latest"
            docker push "$CI_REGISTRY_IMAGE:latest"
            ;;
        esac
      elif [ "${CI_COMMIT_BRANCH:-}" = "beta" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:beta"
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:beta-$CI_COMMIT_SHORT_SHA"
        docker push "$CI_REGISTRY_IMAGE:beta"
        docker push "$CI_REGISTRY_IMAGE:beta-$CI_COMMIT_SHORT_SHA"
      fi
  artifacts:
    name: "orp-${CI_COMMIT_REF_SLUG}"
    paths:
      - dist/orp
    expire_in: never

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: [build-artifacts]
  script:
    - echo "Publishing $CI_COMMIT_TAG binary and container image"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "ORP $CI_COMMIT_TAG"
    description: "Executable: attached as a GitLab job artifact. Container image: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    assets:
      links:
        - name: Linux x86-64 executable (job artifacts)
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=build-artifacts"
        - name: Container registry
          url: "$CI_PROJECT_URL/container_registry"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-beta\.\d+)?$/'
